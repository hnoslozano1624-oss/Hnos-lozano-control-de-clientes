<title>Clientes Mercadeo D&L</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Layout: encabezado de marca (logo horizontal sobre negro, símbolo como marca de agua) y debajo panel general con pestañas. Look único: negro cálido #1A1412, verde vivo del logo, tipografía inclinada como el wordmark. */
:root{
  --bg:#0E0B0A; --surface:#181311; --surface-2:#231C19; --line:#33292A;
  --hero:#1A1412;
  --fg:#F5F2ED; --muted:#A59C94; --gray:#686868;
  --accent:#7ED321; --accent-2:#3E8E0F; --on-accent:#0D0D0D; --accent-ink:#8FE02A; --accent-soft:rgba(126,211,33,.15);
  --grad:linear-gradient(120deg,#9BE635 0%,#6DC21A 45%,#3E8E0F 100%);
  --warn:#F2B134; --warn-soft:rgba(242,177,52,.15);
  --bad:#FF6B5E; --bad-soft:rgba(255,107,94,.16);
  --info:#6DB6F2; --info-soft:rgba(109,182,242,.16);
  --logo-bg:#FFFFFF; --logo-ink:#0D0D0D;
  --sym:url(__SYM__);
  --shadow:0 22px 60px rgba(0,0,0,.65); --scrim:rgba(6,4,3,.72);
  --f-body:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-data:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
.logo{width:44px;height:44px;border-radius:10px;background:var(--logo-bg);object-fit:contain;padding:4px;flex:none;border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--logo-ink);letter-spacing:-.02em}
.logo.ini{background:var(--surface-2);color:var(--accent-ink);padding:0}
.logo.sm{width:30px;height:30px;border-radius:8px;font-size:11px;padding:3px}
.logo.lg{width:64px;height:64px;border-radius:14px;font-size:20px;padding:6px}
body{background-color:var(--bg);background-image:radial-gradient(900px 420px at 100% -5%,rgba(126,211,33,.10),transparent 60%),radial-gradient(700px 400px at -10% 30%,rgba(126,211,33,.05),transparent 60%);background-repeat:no-repeat;color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 64px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:none;margin-inline:0}
.pay-sum.p3{grid-template-columns:repeat(3,minmax(0,1fr))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-data)}

/* encabezado de marca */
.hero{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--hero);border:1px solid var(--line);border-radius:20px;padding:18px 28px;margin-block:18px 24px}
.hero::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--grad)}
.hero::after{content:"";position:absolute;right:190px;top:50%;width:210px;height:210px;transform:translateY(-50%);background:var(--sym) center/contain no-repeat;opacity:.14;z-index:-1;pointer-events:none}
.dyl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;background:#000;border:1px solid var(--line);border-radius:20px;overflow:hidden;padding-left:28px;min-height:210px}
.dyl-t{flex:1;min-width:0;padding:14px 0}
.dyl h1{font-size:clamp(17px,2.1vw,25px);line-height:1.2;max-width:520px;margin:0}
.dyl-img{height:260px;width:auto;display:block;flex:none;margin:-25px 0 -25px;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 22%);mask-image:linear-gradient(to right,transparent 0,#000 22%)}
@media(max-width:560px){.dyl{padding-left:16px}.dyl-img{height:150px}.dyl h1{font-size:15px}}
.hero-logo{height:78px;width:auto;max-width:100%;display:block}
.hero-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:30px;font-weight:800;font-style:italic;letter-spacing:-.015em;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;align-items:center;gap:10px}
h2::before{content:"";display:inline-block;width:18px;height:6px;background:var(--grad);transform:skewX(-35deg);border-radius:1px;flex:none}
h3{font-size:15px;font-weight:700;margin:0}
.slogan{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.slogan i{display:block;width:26px;height:2px;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gray)}
.btn.pri{background:var(--grad);border-color:transparent;color:var(--on-accent);font-weight:800;box-shadow:0 6px 18px rgba(126,211,33,.22)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:3px}

/* resumen */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat{position:relative;overflow:hidden;background:linear-gradient(165deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:20px 18px 16px;min-width:0}
.stat::before{content:"";position:absolute;left:18px;top:0;width:40px;height:4px;background:var(--grad);transform:skewX(-35deg)}
.stat .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-size:27px;font-weight:800;font-style:italic;letter-spacing:-.01em;margin-top:6px;overflow-wrap:anywhere;line-height:1.1}
.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.stat.good .v{color:var(--accent-ink)}
.stat.hot .v{color:var(--bad)}
.stat.warm .v{color:var(--warn)}

.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-bottom:28px}
.panel{background:linear-gradient(180deg,var(--surface),#140F0D);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row.click{cursor:pointer}
.row.click:hover .r-title{text-decoration:underline;text-underline-offset:3px}
.stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--gray);flex:none}
.stripe.bad{background:var(--bad)}.stripe.warn{background:var(--warn)}.stripe.info{background:var(--info)}.stripe.ok{background:var(--accent)}
.r-main{flex:1;min-width:0}
.r-title{font-weight:600;overflow-wrap:anywhere}
.r-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.r-end{text-align:right;flex:none}
.day{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 0 4px;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day.bad{color:var(--bad)}.day.warn{color:var(--warn)}
.empty{color:var(--muted);font-size:13px;padding:14px 0}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.ok{background:var(--accent-soft);color:var(--accent-ink)}
.pill.diego{background:var(--info-soft);color:var(--info)}
.pill.laura{background:var(--accent-soft);color:var(--accent-ink)}

/* clientes */
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{position:relative;overflow:hidden;background:linear-gradient(165deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:12px;min-width:0;text-align:left;width:100%}
.card::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;background:var(--grad);opacity:.04;transform:skewX(-30deg) rotate(12deg);border-radius:24px}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 14px 34px rgba(126,211,33,.10)}
.card .name{font-size:17px;font-weight:800;font-style:italic;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:#2B2321;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right}

/* ficha del cliente */
.back{margin-bottom:6px}
.c-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.c-head .ctx{max-width:70ch;color:var(--muted);margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:20px 18px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);font-weight:800;border-bottom:3px solid var(--accent)}
.tab .n{font-family:var(--f-data);font-size:11px;margin-left:6px;color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}

.task{display:flex;gap:14px;align-items:center;padding:14px 16px;background:linear-gradient(165deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:14px;margin-bottom:8px;min-width:0}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--gray);background:none;cursor:pointer;flex:none;display:grid;place-items:center;padding:0;color:var(--on-accent)}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--grad);border-color:var(--accent)}
.chk svg{width:14px;height:14px;opacity:0}
.chk.on svg{opacity:1}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px}
.sup{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.sup img{width:30px;height:30px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;font-weight:600;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr:first-child td{border-top:0}

/* pagos */
.pay-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.cond{font-size:13px;color:var(--muted);margin-bottom:18px;max-width:80ch}
.pay{background:linear-gradient(165deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;min-width:0}
.pay.done{opacity:.92}
.pay-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.pay-amt{font-size:22px;font-weight:800;font-style:italic}
.steps{display:flex;flex-direction:column;margin:14px 0 4px 4px}
.step{display:flex;gap:12px;position:relative;padding-bottom:12px;min-width:0}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:5px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--gray);background:var(--bg);flex:none;margin-top:4px}
.step.done .dot{background:var(--accent);border-color:var(--accent)}
.step.late .dot{border-color:var(--bad)}
.step.soon .dot{border-color:var(--warn)}
.step .t{font-weight:600;font-size:13px}
.step .d{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pay-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.recv{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.recv:disabled{opacity:.45;cursor:not-allowed}
.recv .chk{width:20px;height:20px;border-radius:6px;pointer-events:none}
details.hist{margin-top:10px;font-size:12px;color:var(--muted)}
details.hist summary{cursor:pointer;font-weight:600}
details.hist ul{margin:6px 0 0;padding-left:18px}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:720px;margin-block:auto;min-width:0}
.m-h{padding:18px 22px 6px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.m-b{padding:8px 22px 6px;display:flex;flex-direction:column;gap:14px}
.m-f{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lab{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:80px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted)}
.hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.svc{display:flex;gap:8px;flex-wrap:wrap}
.svc button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 14px;font-weight:600;font-size:12.5px;cursor:pointer}
.svc button[aria-pressed="true"]{background:var(--grad);border-color:var(--accent);color:var(--on-accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;text-align:left;cursor:pointer}
.seg button b{display:block;font-size:13px}
.seg button span{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.hecha{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 150px 110px 74px 34px;gap:8px;align-items:center}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,.9fr) 34px;gap:8px;align-items:center}
.x{background:none;border:1px solid var(--line);border-radius:8px;height:34px;cursor:pointer;color:var(--muted)}
.x:hover{color:var(--bad);border-color:var(--bad)}
.sum-ok{color:var(--accent-ink)}.sum-bad{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:13px;z-index:90;max-width:min(92vw,520px);box-shadow:var(--shadow)}
.welcome{position:relative;overflow:hidden;background:var(--surface);border:1px dashed var(--gray);border-radius:18px;padding:36px 28px;max-width:680px}
.welcome::after{content:"";position:absolute;right:-20px;bottom:-20px;width:200px;height:200px;background:var(--sym) center/contain no-repeat;opacity:.18;pointer-events:none}
.welcome h3{font-size:22px;font-weight:800;font-style:italic;margin-bottom:8px}
.welcome p{color:var(--muted);margin:0 0 14px}
.welcome ol{margin:0 0 18px;padding-left:18px;color:var(--muted)}
.welcome li{margin-bottom:4px}

.tab-new{margin:0 0 6px 14px;align-self:center;flex:none}
.qitem{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.qhead{display:grid;grid-template-columns:minmax(0,1fr) 150px 66px 130px 34px;gap:8px;align-items:end}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:linear-gradient(165deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard .pn{font-size:16px;font-weight:800;font-style:italic;overflow-wrap:anywhere}
.pcard .pd{font-size:12.5px;color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.psz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.psz div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.psz span{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.psz b{font-family:var(--f-data);font-size:12.5px}
.qpick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qpick select{max-width:340px}
.qtot{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;font-size:13px}
.qtot b{font-family:var(--f-data);font-size:15px}
@media (max-width:820px){
  .stats,.pay-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pay-sum.p3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:minmax(0,1fr)}
  .brand-sub{display:none}
}
@media (max-width:560px){
  .stats,.pay-sum,.pay-sum.p3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:14px 16px}.hero-logo{height:56px}.hero::after{right:-40px}
  h1{font-size:25px}
  .f2,.f3,.seg{grid-template-columns:minmax(0,1fr)}
  .trow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}
  .trow .t-title{grid-column:1/-1}
  .prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}
  .prow .p-label{grid-column:1/-1}
  .qhead{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}
  .qhead .q-n{grid-column:1/-1}
  .tab-new{margin-left:8px}
  .m-h,.m-b,.m-f{padding-inline:16px}
  .task{flex-wrap:wrap}
}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,filter .15s}}
</style>

<div class="wrap" id="app" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
(function(){
'use strict';
const LOGO_H='__LOGO_H__';

/* ───────── utilidades ───────── */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COP = new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const money = n => COP.format(Number(n)||0);
const num = v => Number(String(v==null?'':v).replace(/\D/g,''))||0;
const grp = n => n?new Intl.NumberFormat('es-CO').format(n):'';
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { if(!s) return null; const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
const todayS = () => ymd(new Date());
const dayDiff = (a,b) => Math.round((parse(a)-parse(b))/864e5);
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const fmtD = s => { if(!s) return '—'; const d=parse(s); const o={day:'numeric',month:'short'}; if(d.getFullYear()!==new Date().getFullYear()) o.year='numeric'; return new Intl.DateTimeFormat('es-CO',o).format(d).replace(/\./g,''); };
const fmtTS = iso => { try{ return new Intl.DateTimeFormat('es-CO',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}).format(new Date(iso)).replace(/\./g,''); }catch(e){ return ''; } };
const monthName = (y,m) => { const t=new Intl.DateTimeFormat('es-CO',{month:'long',year:'numeric'}).format(new Date(y,m-1,1)); return t.charAt(0).toUpperCase()+t.slice(1); };
const safeUrl = u => { u=String(u||'').trim(); if(!u) return ''; if(/^https?:\/\//i.test(u)) return u; return 'https://'+u.replace(/^[a-z]+:\/*/i,''); };
const sum = (a,f) => a.reduce((t,x)=>t+(Number(f(x))||0),0);
const plural = (n,a,b) => n===1?a:b;

function payState(p){ return p.received?'pagado':(p.invoiced?'facturado':'porfacturar'); }
function payAlert(p,c){
  if(p.received) return null;
  const t=todayS();
  if(!p.invoiced){
    const d=dayDiff(p.billDate,t), lead=(c&&c.alertDays!=null)?c.alertDays:3;
    if(d<0) return {lvl:'bad',kind:'bill',d,text:'Factura vencida hace '+(-d)+' '+plural(-d,'día','días')};
    if(d===0) return {lvl:'warn',kind:'bill',d,text:'Facturar hoy'};
    if(d<=lead) return {lvl:'warn',kind:'bill',d,text:'Facturar en '+d+' '+plural(d,'día','días')};
    return null;
  }
  if(p.dueDate){ const d=dayDiff(p.dueDate,t); if(d<0) return {lvl:'bad',kind:'pay',d,text:'Cobro atrasado '+(-d)+' '+plural(-d,'día','días')}; }
  return null;
}
const monthEnd=()=>{const d=new Date();return ymd(new Date(d.getFullYear(),d.getMonth()+1,0));};
const monthStart=()=>{const d=new Date();return ymd(new Date(d.getFullYear(),d.getMonth(),1));};
function stats(c){
  const ps=paysOf(c.id), ts=tasksOf(c.id);
  const me=monthEnd(), ms=monthStart();
  const open=ps.filter(p=>!p.received);
  const mesN=open.filter(p=>p.billDate<=me).length, mes=sum(open.filter(p=>p.billDate<=me),p=>p.amount), atras=sum(open.filter(p=>p.billDate<ms),p=>p.amount), futuro=sum(open.filter(p=>p.billDate>me),p=>p.amount);
  const total=sum(ps,p=>p.amount);
  const paid=sum(ps.filter(p=>p.received),p=>p.receivedAmount!=null?p.receivedAmount:p.amount);
  const nextBill=ps.filter(p=>!p.received&&!p.invoiced)[0]||null;
  const nextPay=ps.filter(p=>!p.received&&p.invoiced)[0]||null;
  const done=ts.filter(t=>t.done).length;
  const late=ts.filter(t=>!t.done&&t.due&&dayDiff(t.due,todayS())<0).length;
  return {ps,ts,total,paid,mes,mesN,atras,futuro,saldo:Math.max(0,total-paid),nextBill,nextPay,done,pending:ts.length-done,all:ts.length,late,
    pct:ts.length?Math.round(done/ts.length*100):0,alerts:ps.map(p=>payAlert(p,c)).filter(Boolean)};
}

/* ───────── toast / modal ───────── */
function toast(msg){
  const r=$('#toast-root'); r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toast.t); toast.t=setTimeout(()=>{ r.innerHTML=''; },3600);
}
let modalCleanup=null;
function closeModal(){ $('#modal-root').innerHTML=''; if(modalCleanup){ modalCleanup(); modalCleanup=null; } }
function openModal({title,body,actions,wide,onMount}){
  const root=$('#modal-root');
  root.innerHTML='<div class="scrim" data-scrim><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'" '+(wide?'style="max-width:860px"':'')+'>'
   +'<div class="m-h"><h3>'+esc(title)+'</h3><button class="btn sm" data-close type="button" aria-label="Cerrar">Cerrar</button></div>'
   +'<div class="m-b" id="m-body">'+body+'</div><div class="m-f" id="m-foot"></div></div></div>';
  const foot=$('#m-foot');
  (actions||[]).forEach((a,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='btn '+(a.kind||''); b.textContent=a.label; b.dataset.i=i;
    if(a.id) b.id=a.id; foot.appendChild(b);
  });
  const scrim=$('.scrim',root);
  scrim.addEventListener('mousedown',e=>{ if(e.target===scrim) closeModal(); });
  root.onclick=async e=>{
    const t=e.target.closest('button'); if(!t) return;
    if(t.hasAttribute('data-close')) return closeModal();
    if(t.dataset.i!=null && foot.contains(t)){
      const a=actions[Number(t.dataset.i)];
      if(a.keep){ a.fn&&a.fn(t); return; }
      t.disabled=true;
      try{ const ok=await a.fn(t); if(ok!==false) closeModal(); else t.disabled=false; }
      catch(err){ t.disabled=false; fail(err); }
    }
  };
  const esc_=e=>{ if(e.key==='Escape') closeModal(); };
  document.addEventListener('keydown',esc_); modalCleanup=()=>document.removeEventListener('keydown',esc_);
  if(onMount) onMount(root);
  const f=$('input,textarea,select',$('#m-body')); if(f && !wide) f.focus();
}
function fail(err){
  const c=err&&err.code, m={quota_exceeded:'Se alcanzó el límite de almacenamiento.',too_large:'El archivo supera el tamaño permitido (20 MB).',unsupported_type:'Tipo de archivo no admitido. Use PDF o imagen (PNG, JPG).',invalid_argument:'No tiene permiso para guardar cambios en este tablero.',not_granted:'No tiene permiso para esta acción.',rate_limited:'Demasiadas acciones seguidas. Intente de nuevo en unos segundos.'};
  toast(m[c]||('No se pudo guardar. '+((err&&err.message)||'Intente de nuevo.')));
}

async function uploadFile(file){
  if(!file) return null;
  if(!S.assets) throw {message:'La carga de archivos no está disponible para su usuario. Use un enlace.'};
  const r=await S.assets.upload(file);
  return {fileId:r.id,fileName:file.name,fileType:r.contentType};
}
